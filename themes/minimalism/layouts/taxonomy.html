{{ define "main" }}
<section class="narrow">
  <h1 class="page-title">{{ partial "page-title.html" . }}</h1>
  <ul class="list cats">
    {{- range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}"><span class="t">{{ .Page.Title }}</span><span class="n">{{ .Count }}</span></a></li>
    {{- end }}
  </ul>
</section>
{{ end }}
