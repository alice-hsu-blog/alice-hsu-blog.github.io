{{ define "main" }}
<section class="narrow">
  {{- with .Parent }}
  <p class="crumb"><a href="{{ .RelPermalink }}">← {{ partial "page-title.html" . }}</a></p>
  {{- end }}
  <h1 class="page-title">{{ .Title }}</h1>
  {{- range .Pages.GroupByDate "2006" }}
  <h2 class="year">{{ .Key }}</h2>
  <ul class="list">
    {{- range .Pages }}
    {{ partial "post-row.html" (dict "page" . "right" "") }}
    {{- end }}
  </ul>
  {{- end }}
</section>
{{ end }}
