<table>
  {{ with .THead }}
  <thead>
    {{ range . }} {{/* 這裡的 . 在舊版 Hugo 直接是 Cells 的集合 */}}
    <tr>
      {{ range . }}
        <th>{{ .Text | safeHTML }}</th>
      {{ end }}
    </tr>
    {{ end }}
  </thead>
  {{ end }}

  <tbody>
    {{ range .TBody }}
    <tr>
      {{ $row := . }}
      {{ range $i, $cell := . }}
        <td data-label="{{ with $.THead }}{{ with index (index . 0) $i }}{{ .Text }}{{ end }}{{ end }}">
            <span class="cell-content">
                {{ $cell.Text | safeHTML }}
            </span>
        </td>
      {{ end }}
    </tr>
    {{ end }}
  </tbody>
</table>
