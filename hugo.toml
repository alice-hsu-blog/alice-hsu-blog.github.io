baseURL = "https://alicehsu.blog/"
title = "Alice Hsu's Blog"
theme = ["minimalism", "hugo-embed-pdf-shortcode"]
enableInlineShortcodes = true
languageCode = "en-US"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
timeZone = "America/Chicago"
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true

[markup.goldmark.renderer]
unsafe = true

# 數學公式：$...$ 與 $$...$$ 交給主題的 render-passthrough.html 轉成 MathML
[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [["$$", "$$"], ["\\[", "\\]"]]
inline = [["$", "$"], ["\\(", "\\)"]]

[pagination]
pagerSize = 5

[permalinks]
posts = "/posts/:year/:month/:slug/"
pages = "/:slug/"

[taxonomies]
category = "categories"
tag = "tags"

[languages.en]
languageCode = "en-US"
languageName = "English"
weight = 1

[languages.zh-tw]
languageCode = "zh-TW"
languageName = "繁體中文"
weight = 2


[params]
# seo
description = "Alice Hsu is a composer and a writer sharing her original piano music and stories from her creative journey. On this website, you can listen to her piano recordings, explore piano covers and classical music, and download sheet music from her portfolio. Each composition—whether a gentle melody or a vivid emotional piece—reflects her thoughtful approach to harmony, texture, and storytelling through sound. Beyond music, Alice also writes about her life as an artist, her reflections on creativity, and her experience stepping away from social media to focus on meaningful creation. This is a peaceful online home for music lovers who appreciate authenticity, emotional depth, and the beauty of simplicity in piano art." 
keywords = ["Alice Hsu",
  "composer",
  "piano music",
  "original piano compositions",
  "piano sheet music",
  "piano covers",
  "music stories", 
  "piano arrangement" ]
defaultAuthor = "Alice Hsu"
language = "en-US"
shortName = "Alice Hsu's Blog'"
Twitter_Image = "/favicon.png"
Twitter_Site = "@Alicehsu77"
Image = "/favicon.png"

[params.kroki]
    endpoint = 'https://kroki.io/'
    output = 'img'

[params.favicon]
svg = "/favicon.svg"
ico = "/favicon.ico"

[params.author]
name = "authors.author_name"
title = "authors.author_title"
description = "authors.author_description"
avatar = "/images/avatar2.jpg"


[outputs]
home = ["HTML", "RSS", "JSON", "WebAppManifest"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]

[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
baseName = "site"
isPlainText = true

# 頁首置中的導覽
[[menus.main]]
name = "nav.posts"
pageRef = "/posts"
weight = 10

[[menus.main]]
name = "nav.categories"
pageRef = "/categories"
weight = 20

[[menus.main]]
name = "nav.prayer"
pageRef = "/prayer-request"
weight = 30

[[menus.main]]
name = "nav.about"
pageRef = "/about"
weight = 40

# 頁尾「個人網站」
[[menus.site]]
name = "nav.posts"
pageRef = "/posts"
weight = 10

[[menus.site]]
name = "nav.categories"
pageRef = "/categories"
weight = 20

[[menus.site]]
name = "nav.prayer"
pageRef = "/prayer-request"
weight = 30

[[menus.site]]
name = "nav.music"
pageRef = "/portfolio"
weight = 40

[[menus.site]]
name = "nav.about"
pageRef = "/about"
weight = 50

# 頁尾「其他網站」
[[menus.elsewhere]]
name = "YouTube"
url = "https://www.youtube.com/@alicehsumusic"
weight = 10

[[menus.elsewhere]]
name = "SoundCloud"
url = "https://soundcloud.com/alicehsumusic"
weight = 20

[[menus.elsewhere]]
name = "VisBible"
url = "https://visbible.org/"
weight = 30

# 頁尾最下面一行
[[menus.footer]]
name = "footer.rss_feed"
url = "/index.xml"
weight = 30

# 「文章」頁的精選文章，照這裡的順序排。
#   path：content/ 底下的檔名，不含語言和副檔名
#   title、note：標題和標題下方的小字（翻譯檔的 key 或直接寫文字）；不寫就用文章自己的標題和分類
# 某個語言沒有翻譯的文章，在那個語言的頁面不會出現。
[[params.featured]]
path = "/posts/43_The Stranger"

[[params.featured]]
path = "/posts/50_You are Precious and Honored in My Sight"

[[params.featured]]
path = "/posts/49_Read Dream of the Red Chamber Series one"
title = "featured.red_chamber"
note = "featured.red_chamber_note"

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[module]
  [[module.imports]]
    path = 'github.com/hugomods/kroki'
  [[module.imports]]
    path = 'github.com/hugomods/video-js'
