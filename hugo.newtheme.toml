# 新主題（minimalism）的預覽設定。和 hugo.toml 一起使用，只覆寫新主題需要的部分：
#   hugo server -D --config hugo.toml,hugo.newtheme.toml
# 正式切換時，把這裡的內容搬進 hugo.toml 即可。

theme = ["minimalism", "hugo-embed-pdf-shortcode"]

# 數學公式：$...$ 與 $$...$$ 交給主題的 render-passthrough.html 轉成 MathML
[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [["$$", "$$"], ["\\[", "\\]"]]
inline = [["$", "$"], ["\\(", "\\)"]]

# 新主題沒有舊主題的「列表檢視」輸出格式
[outputs]
home = ["HTML", "RSS", "JSON", "WebAppManifest"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]

[menus]

# 頁首置中的導覽
[[menus.main]]
name = "nav.posts"
pageRef = "/posts"
weight = 10

[[menus.main]]
