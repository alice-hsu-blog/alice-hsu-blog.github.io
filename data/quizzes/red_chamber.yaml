questions:
  - q: 請問薛寶釵的哥哥叫什麼名字？
    options: [薛皖, 薛蟠, 薛碑, 薛膾]
    answer: [2]
    explain: 他游手好閒，不做正經事，後來還因打死人被判刑。

  - q: 下列哪一個「阿姨看紅樓」連載的標題名稱是出自《紅樓夢》？
    options: [搖搖欲墜是賈府, 假作真時真亦假, 情思纏綿寶黛釵, 紅樓一夢恍如煙]
    answer: [2]
    explain: 「假作真時真亦假」出自《紅樓夢》第一回，此為太虛幻境的上聯，下聯是「無為有處有還無」。其他三個選項（以及另外兩篇）的篇名都是我自己想出來的喔！

  - q: 請問 Alice 是哪一派？（複選題）
    options: [黛玉派, 寶釵派, 寶玉派, 可愛動物派]
    answer: [1, 4]
    explain: 有讀過〈情思纏綿寶黛釵〉和〈紅樓一夢恍如煙〉的讀者應該知道，我超討厭男主角賈寶玉。我欣賞寶釵，但更喜歡黛玉，詳情請見〈情思纏綿寶黛釵〉這一篇。然後，我喜歡貓貓、狗狗以及所有萌萌的動物！

  - q: 請問「富胎」這個詞的意思是什麼？
    options: [有錢的女子, 懷孕即將臨盆的女子, 形容人體態豐滿, 含金湯匙出生的小孩]
    answer: [3]
    explain: 也就是胖的意思。賈寶玉曾經對寶釵說過這句話，詳情請見〈情思纏綿寶黛釵〉這一篇。

  - q: 〈正宮妾室大決鬥〉裡，請問賈璉背著鳳姐偷偷娶的人是誰？
    options: [尤二姐, 史湘雲, 尤三姐, 邢岫煙]
    answer: [1]
    explain: 尤二姐是寧國府賈珍的太太尤氏的繼妹，後來被鳳姐設計逼迫，吞金自盡。

  - q: 黛玉在詩社的別號是什麼？
    options: [蘅蕪君, 瀟湘妃子, 稻香老農, 泣雨仙]
    answer: [2]
    explain: 瀟湘妃子是她在詩社時被取的別號；蘅蕪君指的是寶釵；稻香老農是李紈（寶玉的大嫂）；泣雨仙是我亂謅的名字。

  - q: 「溜溜湫湫」是什麼意思？
    options: [形容雨聲的狀聲詞, 濕答答的樣子, 一個人筋骨很柔軟的樣子, 油腔滑調，鬼頭鬼腦，不正經的樣子]
    answer: [4]
    explain: 溜溜湫湫（ㄌㄧㄡ ㄌㄧㄡ ㄐㄧㄠˇ ㄐㄧㄠˇ）：油腔滑調，鬼頭鬼腦，不正經的樣子。例句：細看時，就是賈芸，溜溜湫湫往這邊來了。

  - q: 請問 Alice 喜歡王熙鳳什麼？
    options: [看起來是個很會照顧 I 人小妹妹的 E 人大姐姐, 她聰明, 有溫柔的一面, 以上皆是]
    answer: [4]
    explain: 詳情請見第一篇〈搖搖欲墜是賈府〉。

  - q: 請問被 Alice 吐槽過的《紅樓夢》裡的物品是什麼？
    options: [大紅猩猩氈, 雀金呢, 風月寶鑑, 惜春所畫的大觀園圖]
    answer: [3]
    explain: 它就像哆啦 A 夢裡廢廢的道具，詳情請見第一篇〈搖搖欲墜是賈府〉。

  - q: 下列哪一位到《紅樓夢》結局時仍然活著？
    options: [鳳姐, 晴雯, 平兒, 賈敬]
    answer: [3]
    explain: 鳳姐和晴雯後來因生病而亡，賈敬則是濫食丹藥中毒而死。鳳姐過世之後，賈璉將平兒扶為正妻。

